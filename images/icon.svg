<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <!-- Session Transpose icon (JOHANZE), in the style of UA's Add On icons: dark panel, one flat
       glyph. A MIDI clip and an audio clip, with a violet up/down arrow: every clip moves in pitch.
       Render: sh ../../ableton-to-luna/images/render.sh icon.svg icon.png -->
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2C2D30"/><stop offset="1" stop-color="#17181A"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A99CF6"/><stop offset="1" stop-color="#7A69EA"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" fill="#0D0E0F"/>
  <rect x="4" y="4" width="504" height="504" fill="url(#panel)"/>
  <rect x="4" y="4" width="504" height="4" fill="#ffffff" opacity="0.08"/>
  <!-- MIDI clip: notes stepping up -->
  <rect x="56" y="132" width="250" height="110" rx="14" fill="#E8E9EB"/>
  <g fill="#2C2D30">
    <rect x="78" y="206" width="44" height="14" rx="7"/>
    <rect x="132" y="188" width="44" height="14" rx="7"/>
    <rect x="186" y="170" width="44" height="14" rx="7"/>
    <rect x="240" y="152" width="44" height="14" rx="7"/>
  </g>
  <!-- audio clip: waveform -->
  <rect x="56" y="270" width="250" height="110" rx="14" fill="#E8E9EB"/>
  <g fill="#2C2D30">
    <rect x="80" y="314" width="12" height="22" rx="6"/><rect x="102" y="300" width="12" height="50" rx="6"/>
    <rect x="124" y="290" width="12" height="70" rx="6"/><rect x="146" y="306" width="12" height="38" rx="6"/>
    <rect x="168" y="296" width="12" height="58" rx="6"/><rect x="190" y="286" width="12" height="78" rx="6"/>
    <rect x="212" y="302" width="12" height="46" rx="6"/><rect x="234" y="294" width="12" height="62" rx="6"/>
    <rect x="256" y="310" width="12" height="30" rx="6"/><rect x="278" y="318" width="12" height="14" rx="6"/>
  </g>
  <!-- up/down arrow -->
  <g fill="url(#violet)">
    <path d="M396 92 L460 172 H418 V250 H374 V172 H332 Z"/>
    <path d="M396 420 L460 340 H418 V262 H374 V340 H332 Z" opacity="0.6"/>
  </g>
</svg>
