<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Session Transpose</title>
  <style>
    :root { color-scheme: dark; --accent: #8C7CF0; --bg: #17181A; --panel: #212226; --line: #2E3035; --text: #DDDEE0; --dim: #8A8C92; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 13px -apple-system, Helvetica, sans-serif; display: flex; flex-direction: column; height: 100vh; }
    header { display: flex; align-items: baseline; gap: 8px; padding: 10px 12px 8px; border-bottom: 1px solid var(--line); }
    header h1 { font-size: 13px; font-weight: 600; margin: 0; }
    #status { margin-left: auto; color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 55%; }
    section { padding: 12px; border-bottom: 1px solid var(--line); }
    .stepper { display: flex; align-items: center; justify-content: center; gap: 10px; }
    .stepper button { width: 40px; height: 40px; border-radius: 8px; font-size: 22px; line-height: 1; }
    #amount { width: 96px; text-align: center; font: 600 34px Menlo, monospace; color: var(--accent); background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 0; }
    #amount:hover { border-color: #3A3C42; }
    #amount:focus { outline: none; border-color: var(--accent); background: #111214; }
    #amount.zero { color: var(--text); }
    .unit { text-align: center; color: var(--dim); font-size: 11px; margin-top: 2px; }
    #current { text-align: center; margin-top: 8px; color: var(--dim); }
    #current b { color: var(--text); }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    .actions button { flex: 1; height: 32px; border-radius: 6px; font-weight: 600; }
    button { font: inherit; background: #2B2D32; color: var(--text); border: 1px solid #3A3C42; cursor: pointer; }
    button:hover:not(:disabled) { background: #34363C; }
    button:disabled { opacity: 0.4; cursor: default; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #111; }
    button.primary:hover:not(:disabled) { background: #9D8FF4; }
    #message { min-height: 16px; margin-top: 8px; font-size: 12px; color: var(--dim); text-align: center; }
    #message.warn { color: #F2A33A; }
    h2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--dim); margin: 0 0 8px; display: flex; align-items: center; }
    h2 .link { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--dim); background: none; border: 0; padding: 0; font-size: 11px; text-decoration: underline; }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .chip { display: inline-flex; align-items: center; gap: 4px; background: #2B2D32; border: 1px solid #3A3C42; border-radius: 12px; padding: 2px 4px 2px 9px; font-size: 12px; }
    .chip button { background: none; border: 0; color: var(--dim); padding: 0 4px; font-size: 13px; line-height: 1; }
    .chip button:hover { color: var(--text); background: none; }
    #addTag { margin-top: 8px; width: 100%; background: #111214; border: 1px solid #3A3C42; color: var(--text); border-radius: 6px; padding: 6px 8px; font: inherit; }
    #tracksSection { flex: 1; overflow: auto; border-bottom: 0; }
    #summary { color: var(--dim); font-size: 12px; margin-bottom: 6px; }
    .row { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid #1F2023; }
    .row input[type=checkbox] { margin: 0; accent-color: var(--accent); cursor: pointer; }
    .row label { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; cursor: pointer; }
    .row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .what { color: var(--dim); font-size: 11px; font-family: Menlo, monospace; }
    .row .at { font-family: Menlo, monospace; font-size: 11px; color: var(--accent); min-width: 26px; text-align: right; }
    .row.skip .name { color: var(--dim); text-decoration: line-through; text-decoration-color: #555; }
    .row.skip .what { color: #6C6E74; font-family: inherit; }
  </style>
</head>
<body>
  <header><h1>Session Transpose</h1><div id="status">connecting...</div></header>
  <section>
    <div class="stepper">
      <button id="down" title="Down a semitone">&minus;</button>
      <input id="amount" class="zero" value="0" inputmode="numeric" title="Type an amount (e.g. -5) and press Return">
      <button id="up" title="Up a semitone">+</button>
    </div>
    <div class="unit">semitones</div>
    <div id="current">Session is at <b>0</b></div>
    <div class="actions">
      <button id="apply" class="primary">Apply</button>
      <button id="reset">Back to 0</button>
    </div>
    <div id="message"></div>
  </section>
  <section>
    <h2>Skip tracks named <button class="link" id="defaults">Reset to defaults</button></h2>
    <div class="chips" id="tags"></div>
    <input id="addTag" placeholder="Add a tag (e.g. fx, crash, white noise) and press Return">
  </section>
  <section id="tracksSection">
    <h2>Tracks <span style="margin-left:auto;text-transform:none;letter-spacing:0;font-weight:400">untick to skip</span></h2>
    <div id="summary"></div>
    <div id="tracks"></div>
  </section>
  <script src="vendor/luna.global.js"></script>
  <script src="logic.js"></script>
  <script src="main.js"></script>
</body>
</html>
